# HADDOCK3 workflow templates aligning with script/a.sh
#
# Example 1 — split input mode (Version 3)
#   - Each chain provided as its own PDB.
#   - restrain_bodies outputs are loaded as unambiguous restraints.
#   - Computational data contributes ambiguous restraints.
run_dir = "run_split_example"
mode = "local"
ncores = 20

[input]
molecules = [
  "input/A_chainA.pdb",
  "input/A_chainB.pdb",
  "input/B_chainC.pdb",
  "input/B_chainD.pdb",
]

[topoaa]

[rigidbody]
tolerance = 20
sampling = 10000
ranair = true

[seletop]
select = 200

[flexref]
tolerance = 5
unambig_fname = "restraints/A_body.tbl,restraints/B_body.tbl,restraints/exp_unambig.tbl"
ambig_fname = "restraints/calc_ambig.tbl"
randremoval = true

[mdref]
tolerance = 5
unambig_fname = "restraints/A_body.tbl,restraints/B_body.tbl,restraints/exp_unambig.tbl"
ambig_fname = "restraints/calc_ambig.tbl"
randremoval = true

[emref]
tolerance = 5
unambig_fname = "restraints/A_body.tbl,restraints/B_body.tbl,restraints/exp_unambig.tbl"
ambig_fname = "restraints/calc_ambig.tbl"
randremoval = true

[caprieval]
reference_fname = "reference/native_complex.pdb"

